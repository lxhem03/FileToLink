<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{file_name}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent: #a855f7; --bg: #0a0a0f; --card: #13131f;
            --border: #1e1e30; --text: #e2e8f0; --muted: #64748b; --radius: 12px;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

        nav {
            position: sticky; top: 0; z-index: 200;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px;
            background: rgba(10,10,15,0.97); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .nav-brand { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
        .nav-links a { color: var(--muted); text-decoration: none; font-size: .82rem; margin-left: 16px; }
        .nav-links a:hover { color: var(--text); }

        .page { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }

        .video-wrap {
            position: relative; background: #000;
            border-radius: var(--radius); overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,.8);
        }
        video#player { width: 100%; max-height: 540px; display: block; background: #000; }
        #subCanvas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

        ::cue {
            font-family: 'Inter', Arial, sans-serif; font-size: 1.05em;
            color: #fff; background: rgba(0,0,0,0.78);
            border-radius: 3px; padding: 2px 6px; line-height: 1.5;
        }

        /* Panel — always visible, no JS toggle needed */
        .panel {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 18px 20px;
            margin-top: 14px; display: flex; gap: 16px; flex-wrap: wrap;
        }
        .ctrl-group { display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 150px; }
        .ctrl-group label {
            font-size: .7rem; font-weight: 600; letter-spacing: .8px;
            text-transform: uppercase; color: var(--muted);
            display: flex; align-items: center; gap: 5px;
        }
        .ctrl-group select {
            background: #1a1a2e; color: var(--text);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 10px; font-size: .85rem; cursor: pointer; outline: none;
            font-family: 'Inter', sans-serif; transition: border-color .2s;
            width: 100%;
        }
        .ctrl-group select:focus { border-color: var(--accent); }
        .ctrl-note { font-size: .72rem; color: var(--muted); min-height: 1em; }

        .file-info {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px 18px; margin-top: 14px;
            display: flex; align-items: center; gap: 12px;
        }
        .file-icon { font-size: 1.4rem; color: var(--accent); flex-shrink: 0; }
        .fname { font-size: .9rem; font-weight: 500; word-break: break-all; }
        .fsize { font-size: .75rem; color: var(--muted); margin-top: 2px; }

        .section-label {
            font-size: .7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: .8px; color: var(--muted); margin: 20px 0 10px;
        }
        .ext-btns { display: flex; flex-wrap: wrap; gap: 10px; }
        .ext-btn {
            display: flex; align-items: center; gap: 8px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 9px; padding: 9px 14px;
            color: var(--text); font-size: .82rem;
            text-decoration: none; font-family: 'Inter', sans-serif;
            transition: background .2s, border-color .2s;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .ext-btn:hover, .ext-btn:active { background: #1e1e3a; border-color: var(--accent); }
        .ext-btn img { width: 24px; height: 24px; object-fit: contain; border-radius: 4px; }
        .ext-btn.dl { background: #0f2a1f; border-color: #1a4a30; }
        .ext-btn.dl:hover { background: #163a2a; border-color: #2a6a40; }

        #toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1e1e3a; color: #eee; padding: 10px 20px;
            border-radius: 8px; font-size: .82rem; border: 1px solid var(--accent);
            z-index: 9999; display: none; text-align: center; max-width: 88vw;
            box-shadow: 0 4px 20px rgba(0,0,0,.5);
        }

        footer {
            text-align: center; padding: 28px 16px;
            border-top: 1px solid var(--border); margin-top: 48px;
            font-size: .76rem; color: var(--muted);
        }
        footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>

<nav>
    <span class="nav-brand">Telegram Guy!!</span>
    <div class="nav-links">
        <a href="https://t.me/The_TGguy">Updates</a>
        <a href="https://telegram.me/TGguy_Ownerobot">Support</a>
    </div>
</nav>

<div class="page">

    <div class="video-wrap">
        <video id="player" src="{{file_url}}" controls playsinline preload="metadata"
               width="100%" style="max-height:540px;background:#000;"></video>
        <div id="subCanvas"></div>
    </div>

    <!-- Panel — always shown, no JS needed to make it visible -->
    <div class="panel">

        <div class="ctrl-group">
            <label><i class="fa fa-music"></i> Audio Track</label>
            <select id="audioSel">
                <option value="-1">Detecting…</option>
            </select>
            <div class="ctrl-note" id="audioNote"></div>
        </div>

        <div class="ctrl-group">
            <label><i class="fa fa-closed-captioning"></i> Subtitles</label>
            <select id="subSel">
                <option value="-1">Off</option>
            </select>
            <div class="ctrl-note" id="subNote">Detecting…</div>
        </div>

        <div class="ctrl-group">
            <label><i class="fa fa-gauge-high"></i> Speed</label>
            <select id="speedSel">
                <option value="0.25">0.25×</option>
                <option value="0.5">0.5×</option>
                <option value="0.75">0.75×</option>
                <option value="1" selected>1× Normal</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="1.75">1.75×</option>
                <option value="2">2×</option>
            </select>
        </div>

    </div>

    <div class="file-info">
        <div class="file-icon"><i class="fa fa-file-video"></i></div>
        <div>
            <div class="fname">{{file_name}}</div>
            <div class="fsize">{{file_size}}</div>
        </div>
    </div>

    <div class="section-label">Open in external player</div>
    <div class="ext-btns" id="extBtns">
        <!-- Buttons are built by JS so intent:// URLs can include the live FILE_URL -->
    </div>

</div>

<footer>
    Stream/download links via <a href="https://t.me/FilesXstreamerobot">FileXStreamer</a> bot ·
    <a href="https://telegram.me/TGguy_Ownerobot">Report issue</a><br>
    <span style="margin-top:6px;display:block;">© 2025 · Made by <a href="https://t.me/The_TGguy">Telegram Guy!!</a></span>
</footer>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────────────────────────────
// Constants — injected by Jinja2
// ─────────────────────────────────────────────────────────────────────
const FILE_URL  = "{{file_url}}";
const FILE_NAME = "{{file_name}}";

const _u      = new URL(FILE_URL);
const MSG_ID  = _u.pathname.split("/").filter(Boolean)[0];
const HASH    = _u.searchParams.get("hash") || "";
const BASE    = _u.origin;

const player  = document.getElementById("player");
const audioSel= document.getElementById("audioSel");
const audioNote=document.getElementById("audioNote");
const subSel  = document.getElementById("subSel");
const subNote = document.getElementById("subNote");
const speedSel= document.getElementById("speedSel");

// ─────────────────────────────────────────────────────────────────────
// Speed (works immediately, no server needed)
// ─────────────────────────────────────────────────────────────────────
speedSel.onchange = () => { player.playbackRate = parseFloat(speedSel.value); };

// ─────────────────────────────────────────────────────────────────────
// External player buttons
// Built in JS so the intent:// URL contains the correct FILE_URL
// Using <a href="intent://..."> is the only reliable way to open
// Android apps from Chrome — window.location.href triggers a
// "Leave site?" dialog that users often dismiss.
// ─────────────────────────────────────────────────────────────────────
const enc     = encodeURIComponent(FILE_URL);
const encName = encodeURIComponent(FILE_NAME);
const isAndroid = /android/i.test(navigator.userAgent);
const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);

function makeBtn(icon, label, href, extraClass) {
    const a = document.createElement("a");
    a.className = "ext-btn" + (extraClass ? " " + extraClass : "");
    a.href = href;
    // Open in new tab so the page isn't unloaded on desktop
    // On Android, Chrome will intercept the intent:// and open the app
    a.target = "_blank";
    a.rel    = "noopener noreferrer";
    if (typeof icon === "string" && icon.startsWith("http")) {
        const img = document.createElement("img");
        img.src = icon; img.alt = label;
        a.appendChild(img);
    } else {
        const i = document.createElement("i");
        i.className = icon;
        a.appendChild(i);
    }
    a.appendChild(document.createTextNode(" " + label));
    return a;
}

function buildExternalButtons() {
    const wrap = document.getElementById("extBtns");

    if (isAndroid) {
        // ── Android: intent:// URLs — Chrome opens the app directly ──────
        // MX Player (free)
        wrap.appendChild(makeBtn(
            "https://i.postimg.cc/sx4Msv4T/mx.png", "MX Player",
            `intent:${FILE_URL}#Intent;package=com.mxtech.videoplayer.ad;` +
            `S.title=${encName};S.artist=FileToLink;end`
        ));
        // VLC for Android
        wrap.appendChild(makeBtn(
            "https://i.postimg.cc/15TQ4y7B/vlc.png", "VLC",
            `intent:${FILE_URL}#Intent;package=org.videolan.vlc;` +
            `S.title=${encName};end`
        ));
        // PLAYit
        wrap.appendChild(makeBtn(
            "https://i.postimg.cc/RVGWYJFF/playit.png", "PLAYit",
            `intent:${FILE_URL}#Intent;package=com.playit.videoplayer;` +
            `S.title=${encName};end`
        ));
        // KM Player
        wrap.appendChild(makeBtn(
            "https://i.postimg.cc/wT9tFQ9Z/km.png", "KM Player",
            `intent:${FILE_URL}#Intent;package=com.kmplayer;` +
            `S.title=${encName};end`
        ));
        // nPlayer
        wrap.appendChild(makeBtn(
            "https://i.postimg.cc/XYJr6NGg/s.png", "nPlayer",
            FILE_URL.replace(/^https?/, "nplayer-https")
        ));
    } else if (isIOS) {
        // ── iOS: custom URL schemes ────────────────────────────────────
        wrap.appendChild(makeBtn(
            "https://i.postimg.cc/15TQ4y7B/vlc.png", "VLC",
            `vlc-x-callback://x-callback-url/stream?url=${enc}`
        ));
        wrap.appendChild(makeBtn(
            "https://i.postimg.cc/XYJr6NGg/s.png", "nPlayer",
            FILE_URL.replace(/^https?/, "nplayer-https")
        ));
    } else {
        // ── Desktop: vlc:// and copy-to-clipboard ──────────────────────
        const vlcBtn = makeBtn("https://i.postimg.cc/15TQ4y7B/vlc.png", "Open in VLC", `vlc://${FILE_URL}`);
        vlcBtn.target = "_self";
        wrap.appendChild(vlcBtn);

        const copyBtn = makeBtn("fa fa-copy", "Copy URL", "#");
        copyBtn.addEventListener("click", (e) => {
            e.preventDefault();
            navigator.clipboard?.writeText(FILE_URL)
                .then(() => toast("URL copied! Paste it into your player."))
                .catch(() => toast("Copy failed — select and copy manually:\n" + FILE_URL));
        });
        wrap.appendChild(copyBtn);
    }

    // Download button — always shown
    wrap.appendChild(makeBtn("fa fa-download", "Download", FILE_URL, "dl"));
}

buildExternalButtons();

// ─────────────────────────────────────────────────────────────────────
// Track info — load from /info/ endpoint
// Panel is always visible; selects start with "Detecting…" / "Off"
// ─────────────────────────────────────────────────────────────────────
let subTrackMap    = {};
let nativeTrackMap = {};
let activeSubIdx   = -1;
let octopusInst    = null;
let _octWkr        = "";

async function loadTrackInfo() {
    try {
        // 20 second timeout — free-plan ffprobe can be slow
        const ctrl = new AbortController();
        const tid  = setTimeout(() => ctrl.abort(), 20000);
        const res  = await fetch(`${BASE}/info/${MSG_ID}?hash=${HASH}`, { signal: ctrl.signal });
        clearTimeout(tid);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        buildAudioUI(data.audio    || []);
        buildSubUI(data.subtitles  || []);
    } catch(e) {
        console.warn("Track info unavailable:", e.message);
        // Fallback: show selects with default options
        audioSel.innerHTML = '<option value="-1">Default (single track)</option>';
        audioNote.textContent = "Could not detect tracks — server timeout";
        subSel.innerHTML = '<option value="-1">Off</option>';
        subNote.textContent = "Could not detect subtitles — server timeout";
    }
}

loadTrackInfo();

// ─────────────────────────────────────────────────────────────────────
// Audio
// ─────────────────────────────────────────────────────────────────────
function buildAudioUI(tracks) {
    audioSel.innerHTML = "";

    if (tracks.length <= 1) {
        const label = tracks[0] ? (tracks[0].lang ? `${tracks[0].label} - ${tracks[0].lang}` : tracks[0].label) : "Default";
        audioSel.innerHTML = `<option value="-1">${label}</option>`;
        audioNote.textContent = "Single audio track";
        return;
    }

    tracks.forEach((t, i) => {
        const o = document.createElement("option");
        o.value = t.index;
        o.textContent = t.lang ? `${t.label} - ${t.lang}` : t.label;
        if (i === 0) o.selected = true;
        audioSel.appendChild(o);
    });
    audioNote.textContent = `${tracks.length} tracks — select to switch`;
    audioSel.onchange = () => switchAudio(parseInt(audioSel.value));
}

function switchAudio(idx) {
    const t = player.currentTime;
    const playing = !player.paused;
    player.src = idx < 0 ? FILE_URL : `${BASE}/audio/${MSG_ID}/${idx}?hash=${HASH}`;
    player.load();
    player.addEventListener("loadedmetadata", () => {
        player.currentTime = t;
        if (playing) player.play().catch(() => {});
        if (activeSubIdx >= 0) setTimeout(() => switchSubtitle(activeSubIdx), 400);
    }, { once: true });
}

// ─────────────────────────────────────────────────────────────────────
// Subtitles
// ─────────────────────────────────────────────────────────────────────
function buildSubUI(tracks) {
    subSel.innerHTML = '<option value="-1">Off</option>';
    subTrackMap = {};

    if (tracks.length === 0) {
        subNote.textContent = "No subtitles in this file";
        return;
    }

    tracks.forEach(t => {
        const o = document.createElement("option");
        o.value = t.index;
        o.textContent = t.lang ? `${t.label} [${t.lang}]` : t.label;
        subSel.appendChild(o);
        subTrackMap[t.index] = {
            url:   `${BASE}/sub/${MSG_ID}/${t.index}?hash=${HASH}`,
            fmt:   t.codec || "",
            label: t.label,
            lang:  t.lang || "und",
        };
    });

    subNote.textContent = `${tracks.length} track${tracks.length > 1 ? "s" : ""} available`;
    subSel.onchange = () => switchSubtitle(parseInt(subSel.value));
}

function clearSubs() {
    if (octopusInst) { try { octopusInst.dispose(); } catch(e) {} octopusInst = null; }
    document.getElementById("subCanvas").innerHTML = "";
    Object.values(nativeTrackMap).forEach(el => { try { el.track.mode = "hidden"; } catch(e) {} });
}

async function switchSubtitle(idx) {
    activeSubIdx = idx;
    clearSubs();
    if (idx < 0 || !subTrackMap[idx]) return;

    const info = subTrackMap[idx];
    subNote.textContent = "Loading…";

    try {
        const res = await fetch(info.url);
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        const fmt = (res.headers.get("X-Subtitle-Format") || info.fmt || "").toLowerCase();
        const body = await res.text();

        // Server always returns WebVTT body — show immediately
        await showVTT(body, info);
        subNote.textContent = `▶ ${info.label}${info.lang !== "und" ? " ["+info.lang+"]" : ""}`;

        // If source was ASS, try SubOctopus in background for richer rendering
        if (fmt === "ass" || fmt === "ssa") trySubOctopus(info);

    } catch(e) {
        console.error("Subtitle failed:", e);
        subNote.textContent = "⚠ Failed: " + e.message;
    }
}

async function showVTT(vttText, info) {
    const txt = vttText.trimStart().startsWith("WEBVTT") ? vttText : "WEBVTT\n\n" + vttText;
    const blob = new Blob([txt], { type: "text/vtt" });
    const url  = URL.createObjectURL(blob);

    // Remove previous track for this index
    const prev = nativeTrackMap[info.index];
    if (prev && player.contains(prev)) player.removeChild(prev);

    const el = document.createElement("track");
    el.kind = "subtitles"; el.label = info.label;
    el.srclang = info.lang || "und"; el.src = url;
    player.appendChild(el);
    nativeTrackMap[info.index] = el;

    await new Promise(res => {
        if (el.readyState === 2) { res(); return; }
        el.addEventListener("load",  res, { once: true });
        el.addEventListener("error", res, { once: true });
        setTimeout(res, 5000);
    });
    URL.revokeObjectURL(url);
    if (el.track) el.track.mode = "showing";
}

async function trySubOctopus(info) {
    const cdns = [
        { js: "https://cdnjs.cloudflare.com/ajax/libs/javascript-subtitles-octopus/5.1.0/subtitles-octopus.js",
          wk: "https://cdnjs.cloudflare.com/ajax/libs/javascript-subtitles-octopus/5.1.0/subtitles-octopus-worker.js" },
        { js: "https://cdn.jsdelivr.net/npm/javascript-subtitles-octopus@5.1.0/dist/subtitles-octopus.js",
          wk: "https://cdn.jsdelivr.net/npm/javascript-subtitles-octopus@5.1.0/dist/subtitles-octopus-worker.js" },
        { js: "https://unpkg.com/javascript-subtitles-octopus@5.1.0/dist/subtitles-octopus.js",
          wk: "https://unpkg.com/javascript-subtitles-octopus@5.1.0/dist/subtitles-octopus-worker.js" },
    ];

    if (!window.SubtitlesOctopus) {
        for (const cdn of cdns) {
            try {
                await new Promise((ok, fail) => {
                    const s = document.createElement("script");
                    s.src = cdn.js; s.onload = () => { _octWkr = cdn.wk; ok(); }; s.onerror = fail;
                    document.head.appendChild(s);
                });
                break;
            } catch(e) { console.warn("SubOctopus CDN failed:", cdn.js); }
        }
    }

    if (!window.SubtitlesOctopus) return; // all CDNs failed — WebVTT already shown

    try {
        const res2 = await fetch(info.url);
        if (!res2.ok) return;
        const txt2 = await res2.text();
        const blob = new Blob([txt2], { type: "text/plain" });
        const burl = URL.createObjectURL(blob);
        const wrap = document.getElementById("subCanvas");
        wrap.innerHTML = "";
        Object.values(nativeTrackMap).forEach(el => { try { el.track.mode = "hidden"; } catch(e) {} });

        octopusInst = new window.SubtitlesOctopus({
            video: player, subUrl: burl, workerUrl: _octWkr,
            renderMode: "wasm-blend", targetFps: 24,
            onReady: () => URL.revokeObjectURL(burl),
            onError: (e) => {
                URL.revokeObjectURL(burl);
                if (nativeTrackMap[info.index]?.track)
                    nativeTrackMap[info.index].track.mode = "showing";
            },
        });
        setTimeout(() => {
            const c = document.querySelector(".libassjs-canvas-parent");
            if (c) { c.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;"; wrap.appendChild(c); }
        }, 300);
    } catch(e) { console.warn("SubOctopus render failed:", e); }
}

// ─────────────────────────────────────────────────────────────────────
// Toast
// ─────────────────────────────────────────────────────────────────────
let _tt;
function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg; el.style.display = "block";
    clearTimeout(_tt); _tt = setTimeout(() => el.style.display = "none", 5000);
}

// ─────────────────────────────────────────────────────────────────────
// Debug
// ─────────────────────────────────────────────────────────────────────
window.dbg = async () => {
    console.log("FILE_URL:", FILE_URL);
    console.log("MSG_ID:", MSG_ID, "HASH:", HASH);
    console.log("subTrackMap:", subTrackMap);
    console.log("audioTracks:", player.audioTracks?.length);
    console.log("textTracks:", player.textTracks?.length);
    const r = await fetch(`${BASE}/info/${MSG_ID}?hash=${HASH}`).then(x => x.json()).catch(e => e);
    console.log("/info/ response:", r);
};
</script>
</body>
</html>
