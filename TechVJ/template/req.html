<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{file_name}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent: #a855f7; --bg: #0a0a0f; --card: #13131f;
            --border: #1e1e30; --text: #e2e8f0; --muted: #64748b; --radius: 12px;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

        nav {
            position: sticky; top: 0; z-index: 200;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px;
            background: rgba(10,10,15,0.97); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .nav-brand { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
        .nav-links a { color: var(--muted); text-decoration: none; font-size: .82rem; margin-left: 16px; }
        .nav-links a:hover { color: var(--text); }

        .page { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }

        /* ═══════════════════════════════════════
           VIDEO WRAPPER — fullscreen target
           We fullscreen .video-wrap so the
           overlay panel is visible in fullscreen
        ═══════════════════════════════════════ */
        .video-wrap {
            position: relative; background: #000;
            border-radius: var(--radius); overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,.8);
        }
        video#player {
            width: 100%; max-height: 540px; display: block; background: #000;
        }
        /* Native fullscreen via player.requestFullscreen() —
           the fixed #settingsBtn and #settingsPanel are always on top via z-index */
        video#player:fullscreen,
        video#player:-webkit-full-screen {
            max-height: 100vh;
        }

        /* SubOctopus canvas overlay */
        #subCanvas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

        /* ═══════════════════════════════════════
           IN-PLAYER SETTINGS PANEL
           Floats over the video, visible in
           both normal and fullscreen mode.
        ═══════════════════════════════════════ */
        /* ── Settings button: fixed so it survives any fullscreen mode ── */
        #settingsBtn {
            position: fixed;
            bottom: 72px; right: 12px;
            z-index: 2147483647;          /* max z-index — always on top */
            background: rgba(0,0,0,0.72);
            border: none; border-radius: 8px;
            color: #fff; font-size: 1rem;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(6px);
            transition: background .2s, opacity .2s;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        #settingsBtn:hover,
        #settingsBtn:active { background: rgba(168,85,247,0.85); }

        /* Hide the button when the native video controls are not near
           (user is just watching) — show on tap/hover of video area */
        /* We always show it for simplicity on mobile */

        /* ── Settings panel: fixed so it works in ALL fullscreen modes ── */
        #settingsPanel {
            position: fixed;
            bottom: 120px; right: 12px;
            z-index: 2147483646;
            background: rgba(12,12,22,0.97);
            border: 1px solid rgba(168,85,247,0.45);
            border-radius: 14px;
            padding: 14px 16px;
            width: 278px;
            max-width: calc(100vw - 24px);
            /* Fix 2: scrollable panel */
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            overflow-x: hidden;
            backdrop-filter: blur(18px);
            display: none;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.8);
            scrollbar-width: thin;
            scrollbar-color: rgba(168,85,247,0.4) transparent;
        }
        #settingsPanel::-webkit-scrollbar { width: 4px; }
        #settingsPanel::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.4); border-radius: 4px; }
        #settingsPanel::-webkit-scrollbar-track { background: transparent; }
        #settingsPanel.open { display: flex; }

        .sp-title {
            font-size: .7rem; font-weight: 600; letter-spacing: 1px;
            text-transform: uppercase; color: #a855f7;
            border-bottom: 1px solid rgba(168,85,247,0.2);
            padding-bottom: 8px; margin-bottom: 2px;
        }
        .sp-section { display: flex; flex-direction: column; gap: 8px; }
        .sp-label { font-size: .72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .7px; }

        /* Row for audio / subtitle selects */
        .sp-select {
            background: rgba(30,30,60,0.9); color: #e2e8f0;
            border: 1px solid rgba(100,100,180,0.35); border-radius: 7px;
            padding: 7px 10px; font-size: .82rem; cursor: pointer; outline: none;
            font-family: 'Inter', sans-serif; width: 100%;
        }
        .sp-select:focus { border-color: #a855f7; }

        /* Subtitle appearance controls */
        .sp-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

        /* Color swatches */
        .swatch-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
        .swatch {
            width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: border-color .15s, transform .15s;
            flex-shrink: 0;
        }
        .swatch.active, .swatch:hover { border-color: #fff; transform: scale(1.15); }

        /* Toggle switch */
        .toggle-wrap { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: #cbd5e1; }
        .toggle { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; inset: 0;
            background: #334155; border-radius: 21px; cursor: pointer;
            transition: background .2s;
        }
        .toggle-slider:before {
            content: ""; position: absolute;
            width: 15px; height: 15px; border-radius: 50%;
            background: #fff; top: 3px; left: 3px;
            transition: transform .2s;
        }
        .toggle input:checked + .toggle-slider { background: #a855f7; }
        .toggle input:checked + .toggle-slider:before { transform: translateX(17px); }

        /* Font size slider */
        .sp-slider {
            width: 100%; accent-color: #a855f7; cursor: pointer;
        }
        .sp-slider-row { display: flex; align-items: center; gap: 8px; }
        .sp-slider-val { font-size: .78rem; color: #94a3b8; min-width: 32px; text-align: right; }

        /* ═══════════════════════════════════════
           NATIVE ::cue STYLING
           Updated dynamically by JS
        ═══════════════════════════════════════ */
        #cueStyle { /* injected dynamically */ }

        /* ═══════════════════════════════════════
           BELOW-VIDEO PANEL
        ═══════════════════════════════════════ */
        .panel {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 18px 20px;
            margin-top: 14px; display: flex; gap: 16px; flex-wrap: wrap;
        }
        .ctrl-group { display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 150px; }
        .ctrl-group label {
            font-size: .7rem; font-weight: 600; letter-spacing: .8px;
            text-transform: uppercase; color: var(--muted);
            display: flex; align-items: center; gap: 5px;
        }
        .ctrl-group select {
            background: #1a1a2e; color: var(--text);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 10px; font-size: .85rem; cursor: pointer; outline: none;
            font-family: 'Inter', sans-serif; width: 100%;
        }
        .ctrl-group select:focus { border-color: var(--accent); }
        .ctrl-note { font-size: .72rem; color: var(--muted); min-height: 1em; }

        .file-info {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px 18px; margin-top: 14px;
            display: flex; align-items: center; gap: 12px;
        }
        .file-icon { font-size: 1.4rem; color: var(--accent); flex-shrink: 0; }
        .fname { font-size: .9rem; font-weight: 500; word-break: break-all; }
        .fsize { font-size: .75rem; color: var(--muted); margin-top: 2px; }

        .section-label {
            font-size: .7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: .8px; color: var(--muted); margin: 20px 0 10px;
        }
        .ext-btns { display: flex; flex-wrap: wrap; gap: 10px; }
        .ext-btn {
            display: flex; align-items: center; gap: 8px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 9px; padding: 9px 14px;
            color: var(--text); font-size: .82rem;
            text-decoration: none; font-family: 'Inter', sans-serif;
            transition: background .2s, border-color .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .ext-btn:hover, .ext-btn:active { background: #1e1e3a; border-color: var(--accent); }
        .ext-btn img { width: 24px; height: 24px; object-fit: contain; border-radius: 4px; }
        .ext-btn.dl { background: #0f2a1f; border-color: #1a4a30; }
        .ext-btn.dl:hover { background: #163a2a; border-color: #2a6a40; }

        #toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1e1e3a; color: #eee; padding: 10px 20px;
            border-radius: 8px; font-size: .82rem; border: 1px solid var(--accent);
            z-index: 9999; display: none; text-align: center; max-width: 88vw;
        }
        footer {
            text-align: center; padding: 28px 16px;
            border-top: 1px solid var(--border); margin-top: 48px;
            font-size: .76rem; color: var(--muted);
        }
        footer a { color: var(--accent); text-decoration: none; }
    </style>
    <!-- Dynamic ::cue styles injected by JS into this tag -->
    <style id="cueStyle">
        ::cue {
            font-family: 'Inter', Arial, sans-serif;
            font-size: 1.05em;
            color: #ffffff;
            background: rgba(0,0,0,0.75);
            border-radius: 3px;
            padding: 2px 6px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<nav>
    <span class="nav-brand">Telegram Guy!!</span>
    <div class="nav-links">
        <a href="https://t.me/The_TGguy">Updates</a>
        <a href="https://telegram.me/TGguy_Ownerobot">Support</a>
    </div>
</nav>

<div class="page">

    <!-- ═══════════════════════════════════════
         VIDEO WRAP — fullscreen target
    ═══════════════════════════════════════ -->
    <div class="video-wrap" id="videoWrap">

        <video id="player"
               src="{{file_url}}"
               controls
               playsinline
               preload="metadata"
               width="100%"
               style="max-height:540px;background:#000;">
        </video>

        <div id="subCanvas"></div>

        <!-- ⚙ In-player settings button — visible over the video -->
        <button id="settingsBtn" title="Player settings" aria-label="Player settings">
            <i class="fa fa-gear"></i>
        </button>

        <!-- Settings panel — shown on gear click, works in fullscreen -->
        <div id="settingsPanel">
            <div class="sp-title"><i class="fa fa-sliders"></i> Player Settings</div>

            <!-- Audio track -->
            <div class="sp-section">
                <div class="sp-label">🔊 Audio Track</div>
                <select class="sp-select" id="spAudioSel">
                    <option value="-1">Detecting…</option>
                </select>
            </div>

            <!-- Subtitle track -->
            <div class="sp-section">
                <div class="sp-label">💬 Subtitles</div>
                <select class="sp-select" id="spSubSel">
                    <option value="-1">Off</option>
                </select>
            </div>

            <!-- Subtitle text colour -->
            <div class="sp-section" id="subAppearSection">
                <div class="sp-label">🎨 Subtitle Colour</div>
                <div class="swatch-wrap" id="colorSwatches">
                    <!-- built by JS -->
                </div>
            </div>

            <!-- Subtitle background toggle -->
            <div class="sp-section">
                <div class="toggle-wrap">
                    <label class="toggle">
                        <input type="checkbox" id="bgToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    Subtitle background
                </div>
            </div>

            <!-- Subtitle font size -->
            <div class="sp-section">
                <div class="sp-label">🔤 Subtitle Size</div>
                <div class="sp-slider-row">
                    <input type="range" class="sp-slider" id="sizeSlider" min="60" max="200" value="105" step="5">
                    <span class="sp-slider-val" id="sizeVal">100%</span>
                </div>
            </div>

            <!-- Playback speed -->
            <div class="sp-section">
                <div class="sp-label">⚡ Speed</div>
                <select class="sp-select" id="spSpeedSel">
                    <option value="0.25">0.25×</option>
                    <option value="0.5">0.5×</option>
                    <option value="0.75">0.75×</option>
                    <option value="1" selected>1× Normal</option>
                    <option value="1.25">1.25×</option>
                    <option value="1.5">1.5×</option>
                    <option value="1.75">1.75×</option>
                    <option value="2">2×</option>
                </select>
            </div>

        </div><!-- #settingsPanel -->

    </div><!-- .video-wrap -->

    <!-- Below-video panel (mirrors in-player panel for non-fullscreen ease) -->
    <div class="panel">

        <div class="ctrl-group">
            <label><i class="fa fa-music"></i> Audio Track</label>
            <select id="audioSel"><option value="-1">Detecting…</option></select>
            <div class="ctrl-note" id="audioNote"></div>
        </div>

        <div class="ctrl-group">
            <label><i class="fa fa-closed-captioning"></i> Subtitles</label>
            <select id="subSel"><option value="-1">Off</option></select>
            <div class="ctrl-note" id="subNote">Detecting…</div>
        </div>

        <div class="ctrl-group">
            <label><i class="fa fa-gauge-high"></i> Speed</label>
            <select id="speedSel">
                <option value="0.25">0.25×</option>
                <option value="0.5">0.5×</option>
                <option value="0.75">0.75×</option>
                <option value="1" selected>1× Normal</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="1.75">1.75×</option>
                <option value="2">2×</option>
            </select>
        </div>

    </div>

    <div class="file-info">
        <div class="file-icon"><i class="fa fa-file-video"></i></div>
        <div>
            <div class="fname">{{file_name}}</div>
            <div class="fsize">{{file_size}}</div>
        </div>
    </div>

    <div class="section-label">Open in external player</div>
    <div class="ext-btns" id="extBtns"></div>

</div>

<footer>
    Stream/download links via <a href="https://t.me/FilesXstreamerobot">FileXStreamer</a> bot ·
    <a href="https://telegram.me/TGguy_Ownerobot">Report issue</a><br>
    <span style="margin-top:6px;display:block;">© 2025 · Made by <a href="https://t.me/The_TGguy">Telegram Guy!!</a></span>
</footer>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
// Constants — Jinja2 injects these
// ═══════════════════════════════════════════════════════
const FILE_URL  = "{{file_url}}";
const FILE_NAME = "{{file_name}}";
const _u        = new URL(FILE_URL);
const MSG_ID    = _u.pathname.split("/").filter(Boolean)[0];
const HASH      = _u.searchParams.get("hash") || "";
const BASE      = _u.origin;

// ═══════════════════════════════════════════════════════
// DOM refs
// ═══════════════════════════════════════════════════════
const player     = document.getElementById("player");
const videoWrap  = document.getElementById("videoWrap");
const audioSel   = document.getElementById("audioSel");
const audioNote  = document.getElementById("audioNote");
const subSel     = document.getElementById("subSel");
const subNote    = document.getElementById("subNote");
const speedSel   = document.getElementById("speedSel");
const spAudioSel = document.getElementById("spAudioSel");
const spSubSel   = document.getElementById("spSubSel");
const spSpeedSel = document.getElementById("spSpeedSel");
const cueStyleEl = document.getElementById("cueStyle");

// ═══════════════════════════════════════════════════════
// Speed (both panels synced)
// ═══════════════════════════════════════════════════════
function setSpeed(v) {
    player.playbackRate  = parseFloat(v);
    speedSel.value       = v;
    spSpeedSel.value     = v;
}
speedSel.onchange   = () => setSpeed(speedSel.value);
spSpeedSel.onchange = () => setSpeed(spSpeedSel.value);

// ═══════════════════════════════════════════════════════
// SUBTITLE APPEARANCE
// ═══════════════════════════════════════════════════════
const SUB_COLORS = [
    { name: "White",       hex: "#ffffff" },
    { name: "Yellow",      hex: "#fde047" },
    { name: "Cyan",        hex: "#67e8f9" },
    { name: "Green",       hex: "#86efac" },
    { name: "Orange",      hex: "#fb923c" },
    { name: "Pink",        hex: "#f9a8d4" },
    { name: "Red",         hex: "#f87171" },
    { name: "Light Blue",  hex: "#93c5fd" },
];

let subColor  = "#ffffff";
let subBg     = true;
let subSizePct= 105;

function buildColorSwatches() {
    const wrap = document.getElementById("colorSwatches");
    SUB_COLORS.forEach(c => {
        const s = document.createElement("div");
        s.className   = "swatch" + (c.hex === subColor ? " active" : "");
        s.style.background = c.hex;
        s.title       = c.name;
        s.onclick     = () => {
            wrap.querySelectorAll(".swatch").forEach(x => x.classList.remove("active"));
            s.classList.add("active");
            subColor = c.hex;
            applyCueStyle();
        };
        wrap.appendChild(s);
    });
}

function applyCueStyle() {
    const bg = subBg ? "rgba(0,0,0,0.75)" : "transparent";
    const pad = subBg ? "2px 6px" : "0";
    const size = (subSizePct / 100).toFixed(2) + "em";
    cueStyleEl.textContent = `
        ::cue {
            font-family: 'Inter', Arial, sans-serif;
            font-size: ${size};
            color: ${subColor};
            background: ${bg};
            border-radius: ${subBg ? "3px" : "0"};
            padding: ${pad};
            line-height: 1.5;
        }
    `;
}

// Background toggle
document.getElementById("bgToggle").onchange = function() {
    subBg = this.checked;
    applyCueStyle();
};

// Size slider
const sizeSlider = document.getElementById("sizeSlider");
const sizeVal    = document.getElementById("sizeVal");
sizeSlider.oninput = () => {
    subSizePct = parseInt(sizeSlider.value);
    sizeVal.textContent = subSizePct + "%";
    applyCueStyle();
};

buildColorSwatches();
applyCueStyle();

// ═══════════════════════════════════════════════════════
// IN-PLAYER SETTINGS PANEL — gear button
// Panel is inside .video-wrap so it's visible in fullscreen
// ═══════════════════════════════════════════════════════
const settingsBtn   = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");

settingsBtn.onclick = (e) => {
    e.stopPropagation();
    settingsPanel.classList.toggle("open");
};

// Close panel when clicking outside of it
document.addEventListener("click", (e) => {
    if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
        settingsPanel.classList.remove("open");
    }
});

// Fullscreen: use the player element directly so native controls remain visible.
// The #settingsBtn and #settingsPanel use position:fixed with max z-index,
// so they float above the fullscreen video regardless.
player.addEventListener("dblclick", () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const req = player.requestFullscreen || player.webkitRequestFullscreen;
        if (req) req.call(player);
    } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document);
    }
});

// Reposition settings panel when entering/exiting fullscreen
// so it doesn't overlap the native fullscreen controls bar
function onFullscreenChange() {
    const inFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
    // In fullscreen: move panel higher so it clears the controls bar
    settingsBtn.style.bottom   = inFS ? "80px"  : "72px";
    settingsPanel.style.bottom = inFS ? "130px" : "120px";
}
document.addEventListener("fullscreenchange",       onFullscreenChange);
document.addEventListener("webkitfullscreenchange", onFullscreenChange);

// ═══════════════════════════════════════════════════════
// EXTERNAL PLAYER BUTTONS
// ═══════════════════════════════════════════════════════
const encName   = encodeURIComponent(FILE_NAME);
const isAndroid = /android/i.test(navigator.userAgent);
const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);

function makeBtn(icon, label, href, extraClass) {
    const a = document.createElement("a");
    a.className = "ext-btn" + (extraClass ? " " + extraClass : "");
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    if (typeof icon === "string" && icon.startsWith("http")) {
        const img = document.createElement("img");
        img.src = icon; img.alt = label;
        a.appendChild(img);
    } else {
        const i = document.createElement("i"); i.className = icon; a.appendChild(i);
    }
    a.appendChild(document.createTextNode(" " + label));
    return a;
}

function buildExternalButtons() {
    const wrap = document.getElementById("extBtns");
    if (isAndroid) {
        wrap.appendChild(makeBtn("https://i.postimg.cc/sx4Msv4T/mx.png",     "MX Player", `intent:${FILE_URL}#Intent;package=com.mxtech.videoplayer.ad;S.title=${encName};end`));
        wrap.appendChild(makeBtn("https://i.postimg.cc/15TQ4y7B/vlc.png",    "VLC",       `intent:${FILE_URL}#Intent;package=org.videolan.vlc;S.title=${encName};end`));
        wrap.appendChild(makeBtn("https://i.postimg.cc/RVGWYJFF/playit.png", "PLAYit",    `intent:${FILE_URL}#Intent;package=com.playit.videoplayer;S.title=${encName};end`));
        wrap.appendChild(makeBtn("https://i.postimg.cc/wT9tFQ9Z/km.png",     "KM Player", `intent:${FILE_URL}#Intent;package=com.kmplayer;S.title=${encName};end`));
        wrap.appendChild(makeBtn("https://i.postimg.cc/XYJr6NGg/s.png",      "nPlayer",   FILE_URL.replace(/^https?/, "nplayer-https")));
    } else if (isIOS) {
        wrap.appendChild(makeBtn("https://i.postimg.cc/15TQ4y7B/vlc.png", "VLC",     `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(FILE_URL)}`));
        wrap.appendChild(makeBtn("https://i.postimg.cc/XYJr6NGg/s.png",   "nPlayer", FILE_URL.replace(/^https?/, "nplayer-https")));
    } else {
        const vlcBtn = makeBtn("https://i.postimg.cc/15TQ4y7B/vlc.png", "Open in VLC", `vlc://${FILE_URL}`);
        vlcBtn.target = "_self"; wrap.appendChild(vlcBtn);
        const cpBtn = makeBtn("fa fa-copy", "Copy URL", "#");
        cpBtn.addEventListener("click", e => { e.preventDefault(); navigator.clipboard?.writeText(FILE_URL).then(() => toast("URL copied!")).catch(() => toast("Copy failed")); });
        wrap.appendChild(cpBtn);
    }
    wrap.appendChild(makeBtn("fa fa-download", "Download", FILE_URL, "dl"));
}
buildExternalButtons();

// ═══════════════════════════════════════════════════════
// TRACK INFO — /info/ endpoint
// ═══════════════════════════════════════════════════════
let subTrackMap    = {};
let nativeTrackMap = {};
let activeSubIdx   = -1;
let octopusInst    = null;
let _octWkr        = "";

async function loadTrackInfo() {
    try {
        const ctrl = new AbortController();
        const tid  = setTimeout(() => ctrl.abort(), 20000);
        const res  = await fetch(`${BASE}/info/${MSG_ID}?hash=${HASH}`, { signal: ctrl.signal });
        clearTimeout(tid);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        buildAudioUI(data.audio    || []);
        buildSubUI(data.subtitles  || []);
    } catch(e) {
        console.warn("Track info:", e.message);
        audioSel.innerHTML   = '<option value="-1">Default</option>';
        spAudioSel.innerHTML = '<option value="-1">Default</option>';
        audioNote.textContent = "Server timeout — single track assumed";
        subSel.innerHTML   = '<option value="-1">Off</option>';
        spSubSel.innerHTML = '<option value="-1">Off</option>';
        subNote.textContent = "Subtitle info unavailable";
    }
}

// ═══════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════
function buildAudioUI(tracks) {
    const mkOpts = (sel) => {
        sel.innerHTML = "";
        if (tracks.length <= 1) {
            const label = tracks[0] ? (tracks[0].lang ? `${tracks[0].label} - ${tracks[0].lang}` : tracks[0].label) : "Default";
            sel.innerHTML = `<option value="-1">${label}</option>`;
        } else {
            tracks.forEach((t, i) => {
                const o = document.createElement("option");
                o.value = t.index;
                o.textContent = t.lang ? `${t.label} - ${t.lang}` : t.label;
                if (i === 0) o.selected = true;
                sel.appendChild(o);
            });
        }
    };
    mkOpts(audioSel);
    mkOpts(spAudioSel);
    audioNote.textContent = tracks.length <= 1 ? "Single audio track" : `${tracks.length} tracks — select to switch`;

    const onAudioChange = (v) => {
        audioSel.value = v; spAudioSel.value = v;
        switchAudio(parseInt(v));
    };
    audioSel.onchange   = () => onAudioChange(audioSel.value);
    spAudioSel.onchange = () => onAudioChange(spAudioSel.value);
}

function switchAudio(idx) {
    const t = player.currentTime, playing = !player.paused;
    player.src = idx < 0 ? FILE_URL : `${BASE}/audio/${MSG_ID}/${idx}?hash=${HASH}`;
    player.load();
    player.addEventListener("loadedmetadata", () => {
        player.currentTime = t;
        if (playing) player.play().catch(() => {});
        if (activeSubIdx >= 0) setTimeout(() => switchSubtitle(activeSubIdx), 400);
    }, { once: true });
}

// ═══════════════════════════════════════════════════════
// SUBTITLES
// ═══════════════════════════════════════════════════════
function buildSubUI(tracks) {
    subTrackMap = {};
    const mkOpts = (sel) => {
        sel.innerHTML = '<option value="-1">Off</option>';
        tracks.forEach(t => {
            const o = document.createElement("option");
            o.value = t.index;
            o.textContent = t.lang ? `${t.label} [${t.lang}]` : t.label;
            sel.appendChild(o);
            subTrackMap[t.index] = { url: `${BASE}/sub/${MSG_ID}/${t.index}?hash=${HASH}`, fmt: t.codec || "", label: t.label, lang: t.lang || "und" };
        });
    };
    mkOpts(subSel);
    mkOpts(spSubSel);
    subNote.textContent = tracks.length === 0 ? "No subtitles in this file" : `${tracks.length} track${tracks.length > 1 ? "s" : ""} available`;

    const onSubChange = (v) => {
        subSel.value = v; spSubSel.value = v;
        switchSubtitle(parseInt(v));
    };
    subSel.onchange   = () => onSubChange(subSel.value);
    spSubSel.onchange = () => onSubChange(spSubSel.value);
}

function clearSubs() {
    if (octopusInst) { try { octopusInst.dispose(); } catch(e) {} octopusInst = null; }
    document.getElementById("subCanvas").innerHTML = "";
    Object.values(nativeTrackMap).forEach(el => { try { el.track.mode = "hidden"; } catch(e) {} });
}

async function switchSubtitle(idx) {
    activeSubIdx = idx;
    clearSubs();
    subSel.value = idx; spSubSel.value = idx;
    if (idx < 0 || !subTrackMap[idx]) { subNote.textContent = "Subtitles off"; return; }

    const info = subTrackMap[idx];
    subNote.textContent = "Loading…";
    try {
        const head = await fetch(info.url, { method: "HEAD" }).catch(() => null);
        const fmt  = head ? (head.headers.get("X-Subtitle-Format") || info.fmt || "").toLowerCase() : (info.fmt || "").toLowerCase();
        await showVTT(info);
        subNote.textContent = `▶ ${info.label}${info.lang && info.lang !== "und" ? " ["+info.lang+"]" : ""}`;
        if (fmt === "ass" || fmt === "ssa") trySubOctopus(info);
    } catch(e) {
        console.error("Subtitle error:", e);
        subNote.textContent = "⚠ " + e.message;
    }
}

async function showVTT(info) {
    const prev = nativeTrackMap[info.index];
    if (prev && player.contains(prev)) { player.removeChild(prev); delete nativeTrackMap[info.index]; }

    const el = document.createElement("track");
    el.kind = "subtitles"; el.label = info.label;
    el.srclang = info.lang || "und"; el.src = info.url; el.default = false;
    player.appendChild(el);
    nativeTrackMap[info.index] = el;

    await new Promise(resolve => {
        if (el.readyState === 2) { resolve(); return; }
        if (el.readyState === 3) {
            player.removeChild(el);
            const el2 = document.createElement("track");
            el2.kind = "subtitles"; el2.label = info.label;
            el2.srclang = info.lang || "und"; el2.src = info.url + "&_r=" + Date.now();
            player.appendChild(el2); nativeTrackMap[info.index] = el2;
            el2.addEventListener("load", resolve, { once: true });
            el2.addEventListener("error", resolve, { once: true });
            setTimeout(resolve, 8000); return;
        }
        el.addEventListener("load", resolve, { once: true });
        el.addEventListener("error", resolve, { once: true });
        setTimeout(resolve, 8000);
    });

    Array.from(player.textTracks).forEach(t => { t.mode = "hidden"; });
    const active = nativeTrackMap[info.index];
    if (active?.track) active.track.mode = "showing";
}

async function trySubOctopus(info) {
    const cdns = [
        { js: "https://cdnjs.cloudflare.com/ajax/libs/javascript-subtitles-octopus/5.1.0/subtitles-octopus.js", wk: "https://cdnjs.cloudflare.com/ajax/libs/javascript-subtitles-octopus/5.1.0/subtitles-octopus-worker.js" },
        { js: "https://cdn.jsdelivr.net/npm/javascript-subtitles-octopus@5.1.0/dist/subtitles-octopus.js",      wk: "https://cdn.jsdelivr.net/npm/javascript-subtitles-octopus@5.1.0/dist/subtitles-octopus-worker.js" },
        { js: "https://unpkg.com/javascript-subtitles-octopus@5.1.0/dist/subtitles-octopus.js",                  wk: "https://unpkg.com/javascript-subtitles-octopus@5.1.0/dist/subtitles-octopus-worker.js" },
    ];
    if (!window.SubtitlesOctopus) {
        for (const cdn of cdns) {
            try {
                await new Promise((ok, fail) => { const s = document.createElement("script"); s.src = cdn.js; s.onload = () => { _octWkr = cdn.wk; ok(); }; s.onerror = fail; document.head.appendChild(s); });
                break;
            } catch(e) { console.warn("SubOctopus CDN failed:", cdn.js); }
        }
    }
    if (!window.SubtitlesOctopus) return;
    try {
        const res2 = await fetch(info.url); if (!res2.ok) return;
        const txt2 = await res2.text();
        const blob = new Blob([txt2], { type: "text/plain" });
        const burl = URL.createObjectURL(blob);
        const wrap = document.getElementById("subCanvas");
        wrap.innerHTML = "";
        Array.from(player.textTracks).forEach(t => { try { t.mode = "hidden"; } catch(e) {} });
        octopusInst = new window.SubtitlesOctopus({
            video: player, subUrl: burl, workerUrl: _octWkr, renderMode: "wasm-blend", targetFps: 24,
            onReady: () => URL.revokeObjectURL(burl),
            onError: (e) => { URL.revokeObjectURL(burl); if (nativeTrackMap[info.index]?.track) nativeTrackMap[info.index].track.mode = "showing"; },
        });
        setTimeout(() => {
            const c = document.querySelector(".libassjs-canvas-parent");
            if (c) { c.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;"; wrap.appendChild(c); }
        }, 300);
    } catch(e) { console.warn("SubOctopus render failed:", e); }
}

// ═══════════════════════════════════════════════════════
// Toast
// ═══════════════════════════════════════════════════════
let _tt;
function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg; el.style.display = "block";
    clearTimeout(_tt); _tt = setTimeout(() => el.style.display = "none", 5000);
}

// ═══════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════
loadTrackInfo();
</script>
</body>
</html>
